name: Publish

on:
  push:
    branches:
      - main
  # Retries tagging a released version, e.g. after a failed tag push; run it from the v<version> tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Gates release-please, so a commit that fails checks never gets a tag or a GitHub Release.
  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/test.yml

  release-please:
    runs-on: ubuntu-24.04
    needs: check

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      # Opens or updates the release PR from Conventional Commits; once that PR is merged,
      # creates the v<version> tag and the GitHub Release with the notes from the PR.
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # PRs opened with GITHUB_TOKEN do not trigger other workflows; set RELEASE_TOKEN so Test runs on the release PR.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

  # Tags the Go module (go/v<version>) on the release commit. Go and TS share one version.
  tag:
    runs-on: ubuntu-24.04
    needs: release-please
    # Manual runs skip check and release-please, so they must not depend on their results.
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )

    permissions:
      contents: write

    steps:
      # The go/v<version> tag must point at exactly the release commit.
      - name: Verify the release commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_TYPE" != tag ] || [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::Run Publish from a v<version> release tag, not from $GITHUB_REF_NAME"
              exit 1
            fi
          elif [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release commit $RELEASE_SHA differs from $GITHUB_SHA; run Publish manually from the release tag"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version
        run: |
          VERSION=$(node -p "require('./ts/package.json').version")

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::ts/package.json version $VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # npm publish (Trusted Publisher, environment npm) goes here once the package is published.

      # Skips an existing tag, so a rerun is safe; fails if it points at another commit.
      - name: Tag the Go module
        run: |
          TAG="go/v$VERSION"
          EXISTING=$(git ls-remote --tags --refs origin "refs/tags/$TAG" | cut -f1)

          if [ -z "$EXISTING" ]; then
            git tag "$TAG" HEAD
            git push origin "$TAG"
          elif [ "$EXISTING" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$TAG already points at $EXISTING, not $(git rev-parse HEAD)"
            exit 1
          else
            echo "$TAG already exists"
          fi

      # Makes the version visible to `go get` right away instead of on first request.
      - name: Warm the Go module proxy
        run: curl -fsS --retry 5 --retry-all-errors "https://proxy.golang.org/github.com/usegoodkey/pqc-ratchet/go/@v/v$VERSION.info"

      # Never moves the major tag backwards, e.g. when retrying an older version.
      - name: Move major tag
        run: |
          MAJOR="v${VERSION%%.*}"
          LATEST=$(git ls-remote --tags --refs origin "refs/tags/$MAJOR.*" \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)

          if [ "$LATEST" != "v$VERSION" ]; then
            echo "Leaving $MAJOR unchanged: v$VERSION is not the latest release ($LATEST)"
            exit 0
          fi

          git tag -f "$MAJOR" HEAD
          git push -f origin "$MAJOR"
